# Cloud Run service notes (TEMPLATE ONLY).
# Replace YOUR_PROJECT_ID, YOUR_REGION, YOUR_AR_REPO, YOUR_SERVICE_ACCOUNT.
# Do not apply this file until a real GCP project exists. This phase did not deploy.

# Suggested (not executed):
#   gcloud run services replace deploy/cloudrun.service.yaml --region YOUR_REGION
#
# Required env (set via Secret Manager / Cloud Run env, never the image):
#   LABLINK_ENV=production
#   LABLINK_AUTH_MODE=firebase
#   LABLINK_PERSISTENCE=firestore
#   FIREBASE_PROJECT_ID=YOUR_PROJECT_ID
#   LABLINK_CORS_ORIGINS=https://YOUR_HOSTING_DOMAIN
#   GOOGLE_APPLICATION_CREDENTIALS is unused on Cloud Run if the runtime
#   service account has Firebase Admin + Firestore roles.
#   GEMINI_API_KEY from Secret Manager (optional; AI stays 503 without it)
#
# Do not set LABLINK_AUTH_MODE=test.
# Do not set LABLINK_PERSISTENCE=memory.
# Do not set LABLINK_CORS_ORIGINS=*.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: lablink-api
  annotations:
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: YOUR_SERVICE_ACCOUNT
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: YOUR_REGION-docker.pkg.dev/YOUR_PROJECT_ID/YOUR_AR_REPO/lablink-api:YOUR_TAG
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: LABLINK_ENV
              value: production
            - name: LABLINK_AUTH_MODE
              value: firebase
            - name: LABLINK_PERSISTENCE
              value: firestore
            - name: FIREBASE_PROJECT_ID
              value: YOUR_PROJECT_ID
            - name: LABLINK_CORS_ORIGINS
              value: https://YOUR_HOSTING_DOMAIN
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
